name: Build_Realme_GT7Pro_Kernel
on:
  workflow_dispatch:

jobs:
  build:
    name: Build_Realme_GT7Pro
    runs-on: ubuntu-latest
    env:
      DEFAULT_SUFFIX: "-android15-8-gf4dc45704e54-abogki446052083-4k"
      KERNEL_TIME: "Fri Sep 19 06:13:40 UTC 2025"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧹 自动清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: 🛠 安装依赖并克隆源码
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace && cd kernel_workspace
          sudo apt update && sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev dos2unix ccache p7zip-full aria2 unzip git
          
          # 使用 git clone 代替 aria2c，避免链接失效问题
          # 尝试克隆 master 分支，如果失败则尝试 main
          git clone --depth=1 https://github.com/realme-kernel-opensource/realme_GT7Pro-AndroidB-common-source.git -b master common || \
          git clone --depth=1 https://github.com/realme-kernel-opensource/realme_GT7Pro-AndroidB-common-source.git -b main common
          
          # 下载编译器工具链
          mkdir -p clang18 && aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip
          unzip -q clang.zip -d clang18 && rm -rf clang.zip
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip && rm -rf build-tools.zip

      - name: 🛠️ 注入 /dev/my_comm 驱动
        run: |
          cd kernel_workspace/common/drivers/misc
          cat <<EOF > my_ioctl_driver.c
          #include <linux/module.h>
          #include <linux/fs.h>
          #include <linux/uaccess.h>
          #include <linux/device.h>

          #define DEVICE_NAME "my_comm"
          #define MY_MAGIC 'k'
          #define CMD_SEND_DATA _IOW(MY_MAGIC, 1, char *)

          static int major;
          static struct class *cls;

          static long my_ioctl(struct file *file, unsigned int cmd, unsigned long arg) {
              char buf[128];
              if (cmd == CMD_SEND_DATA) {
                  if (copy_from_user(buf, (char __user *)arg, sizeof(buf))) return -EFAULT;
                  printk(KERN_INFO "内核通过 ioctl 收到数据: %s\n", buf);
              }
              return 0;
          }

          static struct file_operations fops = { .unlocked_ioctl = my_ioctl };

          static int __init my_init(void) {
              major = register_chrdev(0, DEVICE_NAME, &fops);
              cls = class_create(THIS_MODULE, DEVICE_NAME);
              device_create(cls, NULL, MKDEV(major, 0), NULL, DEVICE_NAME);
              return 0;
          }
          
          static void __exit my_exit(void) {
              device_destroy(cls, MKDEV(major, 0));
              class_destroy(cls);
              unregister_chrdev(major, DEVICE_NAME);
          }

          module_init(my_init);
          module_exit(my_exit);
          MODULE_LICENSE("GPL v2");
          EOF
          sed -i '1i\obj-y += my_ioctl_driver.o' Makefile

      - name: ⚙️ 配置 KernelSU 与 SUSFS
        run: |
          cd kernel_workspace
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s builtin
          git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu.git -b gki-android15-6.6
          cd ./common && patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch || true
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

      - name: 🔧 设置 gki_defconfig 并注入版本号
        run: |
          cd kernel_workspace/common
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
          sed -i "s/CONFIG_LOCALVERSION=\"\"/CONFIG_LOCALVERSION=\"${DEFAULT_SUFFIX}\"/" arch/arm64/configs/gki_defconfig
          sed -i 's/${scm_version}//' scripts/setlocalversion

      - name: 🔨 编译内核 (SM8750)
        run: |
          WORKDIR="$(pwd)"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          export KBUILD_BUILD_TIMESTAMP="${KERNEL_TIME}"
          export KBUILD_BUILD_USER="realme"
          export KBUILD_BUILD_HOST="ubuntu"
          cd kernel_workspace/common
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-Wno-error Image

      - name: 📤 上传内核
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_GT7Pro_Custom_Comm
          path: kernel_workspace/common/out/arch/arm64/boot/Image
